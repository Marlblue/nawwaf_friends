# Deploy otomatis ke cPanel DomaiNesia (Setup Node.js App) setiap push ke main.
# Build dilakukan di runner GitHub (RAM shared hosting tidak cukup untuk next build),
# lalu hasilnya dikirim lewat SSH dan aplikasinya di-restart.
#
# Secrets repo: SSH_HOST, SSH_PORT, SSH_USER, SSH_PRIVATE_KEY, OPS_ALERT_WEBHOOK_URL (opsional, kabar ke Telegram)
# Env var form (COLLAB_SCRIPT_URL, dst.) dan SANITY_REVALIDATE_SECRET tetap diisi di cPanel.
# Variables repo: NEXT_PUBLIC_SANITY_PROJECT_ID, NEXT_PUBLIC_SANITY_DATASET (dipakai saat build).
name: Deploy ke cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

env:
  APP_DIR: nawwafresto # Application root di Setup Node.js App, relatif ke home

jobs:
  deploy:
    # Dipaku ke 24.04, sama seperti kalih-signature dan sdbi: ubuntu-latest pindah ke
    # Ubuntu 26 mulai 19 Oktober 2026, dan job ini yang rsync ke situs produksi.
    # ci.yml sengaja dibiarkan di ubuntu-latest supaya image barunya datang duluan di
    # pull request, tempat kegagalannya murah. Kembalikan ke ubuntu-latest begitu
    # ci.yml hijau di Ubuntu 26 selama beberapa minggu.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Gerbang sebelum build, sama seperti kalih-signature dan sdbi: push langsung ke
      # main yang lint-nya merah berhenti di sini, bukan sampai ke situs. Cek tipe
      # sudah dijalankan `next build` sendiri.
      - run: pnpm lint

      # Celah keamanan di paket yang melayani pengunjung (Next, React, dan
      # seterusnya) menghentikan deploy, dan grup Telegram menerima "Deploy GAGAL".
      # Pohon Sanity Studio/CLI sengaja dilewati; lihat scripts/audit-runtime-deps.mjs.
      - run: pnpm cek:audit

      - run: pnpm build:cpanel
        env:
          # Dibaca saat build (NEXT_PUBLIC_ di-inline). Kosong = /artikel tampil "belum ada artikel".
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}

      # -4 di semua koneksi SSH: runner GitHub tidak punya rute IPv6, jadi kalau host
      # ter-resolve ke IPv6 koneksinya gagal "Network is unreachable".
      - name: Siapkan SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -4 -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload ke server
        # --delete menyamakan folder app dengan hasil build; tmp/ (restart Passenger) dan log dibiarkan.
        run: |
          rsync -az --delete \
            --exclude 'tmp/' --exclude '*.log' \
            -e "ssh -4 -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            deploy/app/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${APP_DIR}/"

      - name: Restart aplikasi
        # Passenger me-restart app Node saat tmp/restart.txt disentuh.
        run: |
          ssh -4 -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p ${APP_DIR}/tmp && touch ${APP_DIR}/tmp/restart.txt"

      - name: Cek situs
        run: |
          sleep 5
          curl -fsS -o /dev/null -w "nawwafresto.com: %{http_code}\n" https://nawwafresto.com/

      # Kabar hasil deploy ke grup. `always()` supaya tetap jalan saat langkah di atas gagal.
      # Pesan commit dibaca lewat env, bukan interpolasi, supaya tidak bisa menyisipkan perintah.
      - name: Susun kabar deploy
        id: kabar
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SUBJECT=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)
          [ -n "$SUBJECT" ] || SUBJECT="(dijalankan manual oleh $ACTOR)"
          SHORT_SHA=$(printf '%s' "$COMMIT_SHA" | cut -c1-7)
          case "$JOB_STATUS" in
            success) TEXT="Deploy BERHASIL: $SUBJECT ($SHORT_SHA). Situs sudah memakai versi baru." ;;
            cancelled) TEXT="Deploy DIBATALKAN: $SUBJECT ($SHORT_SHA). $RUN_URL" ;;
            *) TEXT="Deploy GAGAL: $SUBJECT ($SHORT_SHA). Cek log: $RUN_URL" ;;
          esac
          echo "teks=$TEXT" >> "$GITHUB_OUTPUT"

      # continue-on-error: kabar yang memantul tidak boleh memerahkan deploy yang berhasil,
      # tapi `wajib` tetap menandai langkahnya merah supaya kelihatan di log.
      - name: Kabari grup
        if: always()
        continue-on-error: true
        uses: Marlblue/website-ops/actions/kabari@ac5bef7704bc2dbde9207e91ec48917544997f54 # main
        with:
          pesan: ${{ steps.kabar.outputs.teks }}
          label: nawwafresto.com
          webhook: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          wajib: true
