# Pemeriksaan sebelum merge, sama seperti kalih-signature dan sdbi. deploy.yml baru
# jalan setelah push ke main, jadi tanpa workflow ini build yang rusak baru ketahuan
# saat deploy, dan situsnya tertahan di versi lama sampai diperbaiki.
name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Versi pnpm dibaca dari packageManager di package.json, jadi CI dan lokal tidak melenceng.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # Gerbang yang sama dengan deploy.yml: hanya advisory di paket yang melayani
      # pengunjung yang memerahkan PR. Lihat scripts/audit-runtime-deps.mjs.
      - run: pnpm cek:audit

      # `build:cpanel`, bukan `pnpm build`: bundel cPanel ikut dirakit supaya pemeriksaan
      # sharp di scripts/pack-cpanel.mjs jalan di Linux sebelum merge, bukan baru saat
      # deploy. Project ID Sanity dibaca saat build; kalau Variables repo belum diisi,
      # langkah ini dilewati dengan peringatan.
      - name: Build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
        run: |
          if [ -z "$NEXT_PUBLIC_SANITY_PROJECT_ID" ]; then
            echo "::warning::Variable NEXT_PUBLIC_SANITY_PROJECT_ID belum diisi, langkah build dilewati."
            exit 0
          fi
          pnpm build:cpanel

      # Tes browser terhadap build di atas (e2e/). Menangkap halaman yang rusak di browser
      # walau lint, typecheck, dan build lolos.
      - name: Pasang browser untuk tes
        if: vars.NEXT_PUBLIC_SANITY_PROJECT_ID != ''
        run: pnpm exec playwright install --with-deps chromium

      - name: Tes browser
        if: vars.NEXT_PUBLIC_SANITY_PROJECT_ID != ''
        run: pnpm test:e2e

      # Lighthouse terhadap build yang sama (lighthouserc.json): beranda dan daftar artikel,
      # tiap halaman 3 kali, diambil median. Yang menggagalkan PR cuma pergeseran layout
      # (CLS > 0,1): angkanya stabil antar-run dan pernah lolos dari PageSpeed (kasus CLS
      # 0,400 kalih-signature, September 2026). Skor kategori cuma peringatan karena di
      # runner GitHub berayun beberapa poin antar-run. Throttling "devtools", bukan simulasi,
      # karena simulasi menganggap seluruh HTML datang sekaligus dan melewatkan kasus itu.
      # Versi dipaku; 0.16.0 rilis 2 November 2026, terlalu baru untuk dipakai.
      - name: Lighthouse
        if: vars.NEXT_PUBLIC_SANITY_PROJECT_ID != ''
        env:
          PORT: "3930"
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Simpan laporan Lighthouse
        if: always() && vars.NEXT_PUBLIC_SANITY_PROJECT_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laporan-lighthouse
          path: .lighthouseci/
          # .lighthouseci diawali titik; upload-artifact melewatkan folder tersembunyi kalau tidak diminta.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

      - name: Simpan jejak tes yang gagal
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jejak-tes-browser
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Pengganti secret scanning GitHub, yang untuk repo private butuh paket berbayar.
  # Memindai seluruh riwayat, bukan hanya commit PR ini: kunci yang pernah ter-commit
  # tetap bisa dibaca dari riwayat walau sudah dihapus di commit berikutnya.
  # Kalau yang ditemukan ternyata bukan kunci, daftarkan sidik jarinya di
  # .gitleaksignore (gitleaks mencetaknya), jangan matikan job ini.
  # Kalau benar kunci: cabut/ganti kuncinya di layanan asalnya dulu. Menghapus dari
  # riwayat saja tidak cukup, karena salinannya sudah ada di GitHub.
  rahasia:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Binary resmi, versi dan checksum dipaku seperti action lain di repo ini.
      # Naikkan keduanya bersamaan; checksum ada di gitleaks_<versi>_checksums.txt
      # pada halaman rilis gitleaks/gitleaks.
      - name: Pindai kunci rahasia (gitleaks)
        env:
          GITLEAKS_VERSI: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSI}/gitleaks_${GITLEAKS_VERSI}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --verbose .
