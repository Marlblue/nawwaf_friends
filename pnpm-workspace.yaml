allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false

# Versi aman untuk paket yang dibawa Next, sama seperti kalih-signature dan sdbi.
# Keduanya kenaikan patch di major yang sama; hapus begitu Next sendiri menarik
# versi yang sudah ditambal.
overrides:
  # GHSA-wq5f-xc86-pv6w (high): celah librsvg saat membaca SVG, ditambal di 0.35.5.
  sharp: ^0.35.5
  # GHSA-68fv-2mgg-jv7q (high): source map berindeks bisa bikin event loop macet,
  # ditambal di 1.2.2. Dibawa postcss yang dikunci Next.
  source-map-js: ^1.2.2
  # Paket transitif di pohon Sanity Studio/CLI (bukan jalur pengunjung, lihat
  # scripts/audit-runtime-deps), dinaikkan ke versi yang sudah ditambal: brace-expansion,
  # js-yaml, smol-toml, uuid, dan dompurify, advisory sampai Oktober 2026. Semua di major
  # yang sama kecuali uuid 10 -> 11 dan brace-expansion 4 -> 5, alasannya sama dengan
  # catatan di kalih-signature. Hapus satu per satu begitu induknya menarik versi aman.
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.7
  brace-expansion@>=4: ^5.0.12
  js-yaml@3: ^3.15.2
  smol-toml: ^1.9.0
  uuid@10: ^11.1.1
  dompurify@3: ^3.4.16
  # @module-federation/dts-plugin menyemat 7.29.1 persis. GHSA undici Oktober 2026
  # (DoS content-encoding, EventSource, SRI), ditambal di 7.30.1.
  undici@7: ^7.30.1
  # @pierre/diffs (pohon Sanity Studio) menyemat 9.0.5 persis, sedangkan @shikijs/core
  # sejak sanity 6.21 menarik 9.0.6. Dua versi itu sama-sama ikut ter-trace ke standalone,
  # dan scripts/pack-cpanel.mjs menolak paket ganda saat meratakan node_modules. Hapus
  # begitu @pierre/diffs melonggarkan sematannya.
  hast-util-to-html@9: ^9.0.6
